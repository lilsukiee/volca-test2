<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Volca iPhone Multi-WAV Web Test</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;margin:0;color:#111}
.wrap{max-width:720px;margin:auto;padding:20px 14px 50px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 12px #0001}
h1{font-size:23px;margin:0 0 8px}.note{font-size:14px;color:#666;line-height:1.55}
input[type=file]{font-size:16px;width:100%;margin:18px 0}
.status{background:#f1f1f4;border-radius:12px;padding:13px;margin:12px 0;white-space:pre-wrap}
.good{color:#08752c;font-weight:700}.bad{color:#b00020;font-weight:700}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:8px;padding:9px 10px;background:#fafafa;border-radius:10px;margin:7px 0}
.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.size{font-size:12px;color:#777}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>Volca iPhone Multi‑WAV Web Test</h1>
<p class="note">HTTPS 웹페이지에서 iPhone Safari의 다중 WAV 선택과 JavaScript 처리를 확인합니다.</p>

<input id="files" type="file" accept=".wav,audio/wav,audio/x-wav" multiple>

<div id="status" class="status">대기 중입니다.</div>
<div id="list"></div>
</div></div>

<script>
const input=document.getElementById('files');
const status=document.getElementById('status');
const list=document.getElementById('list');

function fmt(n){
 return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';
}
function render(){
 const files=Array.from(input.files||[]);
 if(!files.length){
   status.innerHTML='<span class="bad">파일이 감지되지 않았습니다.</span>';
   list.innerHTML='';
   return;
 }
 const total=files.reduce((a,f)=>a+f.size,0);
 status.innerHTML=`<span class="good">성공: ${files.length}개 파일 감지</span><br>총 ${fmt(total)}`;
 list.innerHTML='';
 files.forEach((f,i)=>{
   const row=document.createElement('div');
   row.className='row';
   row.innerHTML=`<b>${String(i).padStart(2,'0')}</b><div class="name">${f.name}</div><div class="size">${fmt(f.size)}</div>`;
   list.appendChild(row);
 });
}
input.addEventListener('change',render);
input.addEventListener('input',render);
</script>
</body>
</html>

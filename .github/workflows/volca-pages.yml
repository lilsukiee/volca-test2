name: Build Volca Sampler Multi Import

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout upstream Volca Sampler
        uses: actions/checkout@v4
        with:
          repository: benwiley4000/volca-sampler
          ref: master
          path: app
          submodules: recursive
          fetch-depth: 1

      - name: Patch multi-file audio import
        shell: python
        run: |
          from pathlib import Path

          p = Path("app/src/SampleRecord.js")
          s = p.read_text(encoding="utf-8")

          old = """  /** @type {React.ChangeEventHandler<HTMLInputElement>} */
          const importFile = useCallback(
            (e) => {
              if (e.target.files && e.target.files.length) {
                const file = e.target.files[0];
                file.arrayBuffer().then(async (arrayBuffer) => {
                  const audioFileBuffer = new Uint8Array(arrayBuffer);
                  /**
                   * @type {AudioBuffer}
                   */
                  let audioBuffer;
                  try {
                    audioBuffer = await getAudioBufferForAudioFileData(audioFileBuffer);
                  } catch (err) {
                    alert('Unsupported audio format detected');
                    return;
                  }
                  if (audioBuffer.length > 65 * audioBuffer.sampleRate) {
                    alert('Please select an audio file no more than 65 seconds long');
                    return;
                  }
                  setCaptureState('finalizing');
                  const result = await onRecordFinish(audioFileBuffer, file);
                  setCaptureState('ready');
                  if (result === 'silent') {
                    setShowSilenceWarning(true);
                  }
                });
              }
            },
            [onRecordFinish]
          );"""

          new = """  /** @type {React.ChangeEventHandler<HTMLInputElement>} */
          const importFile = useCallback(
            async (e) => {
              const files = Array.from(e.target.files || []);
              if (!files.length) {
                return;
              }

              e.target.value = '';
              setCaptureState('finalizing');

              let importedCount = 0;
              let silentCount = 0;
              const failedFiles = [];

              for (const file of files) {
                try {
                  const arrayBuffer = await file.arrayBuffer();
                  const audioFileBuffer = new Uint8Array(arrayBuffer);

                  let audioBuffer;
                  try {
                    audioBuffer = await getAudioBufferForAudioFileData(
                      audioFileBuffer
                    );
                  } catch (err) {
                    failedFiles.push(`${file.name}: unsupported format`);
                    continue;
                  }

                  if (audioBuffer.length > 65 * audioBuffer.sampleRate) {
                    failedFiles.push(`${file.name}: longer than 65 seconds`);
                    continue;
                  }

                  const result = await onRecordFinish(audioFileBuffer, file);
                  importedCount += 1;

                  if (result === 'silent') {
                    silentCount += 1;
                  }
                } catch (err) {
                  failedFiles.push(`${file.name}: ${String(err)}`);
                }
              }

              setCaptureState('ready');

              if (silentCount) {
                setShowSilenceWarning(true);
              }

              if (failedFiles.length) {
                alert(
                  `${importedCount} file(s) imported.\\n\\n` +
                    `${failedFiles.length} file(s) could not be imported:\\n` +
                    failedFiles.join('\\n')
                );
              }
            },
            [onRecordFinish]
          );"""

          if old not in s:
              raise SystemExit(
                  "Upstream SampleRecord.js changed; import handler patch did not match."
              )

          s = s.replace(old, new, 1)

          old_input = """            Import an audio file
            <input
              hidden
              type="file"
              accept={ANY_FILE ? undefined : 'audio/*,video/*,.wav,.mp3,.ogg'}
              onChange={importFile}
            />"""

          new_input = """            Import audio files
            <input
              hidden
              type="file"
              multiple
              accept={ANY_FILE ? undefined : 'audio/*,video/*,.wav,.mp3,.ogg'}
              onChange={importFile}
            />"""

          if old_input not in s:
              raise SystemExit(
                  "Upstream SampleRecord.js changed; file input patch did not match."
              )

          s = s.replace(old_input, new_input, 1)
          p.write_text(s, encoding="utf-8")
          print("Multi-file import patch applied.")

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "16"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "2.0.34"
          actions-cache-folder: emsdk-cache

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build KORG SYRO browser bindings
        working-directory: app
        run: |
          chmod +x build-bindings.sh build-factory-samples-index
          ./build-bindings.sh
          ./build-factory-samples-index

      - name: Build web app
        working-directory: app
        env:
          CI: "false"
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

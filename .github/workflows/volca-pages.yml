name: Build Volca Sampler v8 Visible Select All

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout upstream Volca Sampler
        uses: actions/checkout@v4
        with:
          repository: benwiley4000/volca-sampler
          ref: master
          path: app
          submodules: recursive
          fetch-depth: 1

      - name: Apply custom patches
        shell: python
        run: |
          from pathlib import Path

          # ---------- Multi import ----------
          p = Path("app/src/SampleRecord.js")
          s = p.read_text(encoding="utf-8")
          start_marker = "  /** @type {React.ChangeEventHandler<HTMLInputElement>} */\n  const importFile = useCallback("
          end_marker = "  return {"
          start = s.find(start_marker)
          if start == -1:
              raise SystemExit("Could not find importFile start")
          end = s.find(end_marker, start)
          if end == -1:
              raise SystemExit("Could not find importFile end")

          replacement = """  /** @type {React.ChangeEventHandler<HTMLInputElement>} */
            const importFile = useCallback(
              async (e) => {
                const files = Array.from(e.target.files || []);
                if (!files.length) return;

                e.target.value = "";

                const startSlotText = window.prompt(
                  `Start Volca slot for ${files.length} file(s) (0-99):`,
                  "0"
                );
                if (startSlotText === null) return;

                const startSlot = Number.parseInt(startSlotText, 10);
                if (!Number.isInteger(startSlot) || startSlot < 0 || startSlot > 99) {
                  window.alert("Start slot must be a number from 0 to 99.");
                  return;
                }
                if (startSlot + files.length - 1 > 99) {
                  window.alert(
                    `Too many files for slot ${startSlot}. Choose ${100 - startSlot} file(s) or fewer.`
                  );
                  return;
                }

                setCaptureState("finalizing");
                let nextSlot = startSlot;
                let silentCount = 0;
                const failedFiles = [];

                for (const file of files) {
                  try {
                    const arrayBuffer = await file.arrayBuffer();
                    const audioFileBuffer = new Uint8Array(arrayBuffer);
                    let audioBuffer;
                    try {
                      audioBuffer = await getAudioBufferForAudioFileData(audioFileBuffer);
                    } catch (err) {
                      failedFiles.push(`${file.name}: unsupported audio format`);
                      continue;
                    }
                    if (audioBuffer.length > 65 * audioBuffer.sampleRate) {
                      failedFiles.push(`${file.name}: longer than 65 seconds`);
                      continue;
                    }

                    const result = await onRecordFinish(audioFileBuffer, file, nextSlot);
                    if (result === "silent") {
                      silentCount += 1;
                    } else {
                      nextSlot += 1;
                    }
                  } catch (err) {
                    failedFiles.push(`${file.name}: ${String(err)}`);
                  }
                }

                setCaptureState("ready");
                if (silentCount) setShowSilenceWarning(true);

                const importedCount = nextSlot - startSlot;
                if (importedCount) {
                  window.alert(
                    `${importedCount} sample(s) imported to slots ${startSlot}-${nextSlot - 1}.`
                  );
                }
                if (failedFiles.length) {
                  window.alert(
                    `Some files could not be imported:\\n\\n${failedFiles.join("\\n")}`
                  );
                }
              },
              [onRecordFinish]
            );
          """
          s = s[:start] + replacement + s[end:]

          if "Import an audio file" in s:
              s = s.replace("Import an audio file", "Import audio files", 1)

          needle = '              type="file"\n              accept='
          if needle in s:
              s = s.replace(
                  needle,
                  '              type="file"\n              multiple\n              accept=',
                  1,
              )
          p.write_text(s, encoding="utf-8")

          # ---------- Auto slot support ----------
          p = Path("app/src/App.js")
          s = p.read_text(encoding="utf-8")
          old_handler = "const handleRecordFinish = useCallback(async (audioFileBuffer, userFile) => {"
          new_handler = "const handleRecordFinish = useCallback(async (audioFileBuffer, userFile, slotNumber = 0) => {"
          if old_handler in s:
              s = s.replace(old_handler, new_handler, 1)
          elif new_handler not in s:
              raise SystemExit("Could not find handleRecordFinish")

          needle = """    const sample = new SampleContainer.Mutable({
                name,
                sourceFileId,
                trim: { frames: trimFrames },"""
          replacement = """    const sample = new SampleContainer.Mutable({
                name,
                sourceFileId,
                slotNumber,
                trim: { frames: trimFrames },"""
          if needle in s:
              s = s.replace(needle, replacement, 1)
          elif "      slotNumber,\n      trim:" not in s:
              raise SystemExit("Could not patch slotNumber")
          p.write_text(s, encoding="utf-8")

          # ---------- iOS/Safari audio resume ----------
          p = Path("app/src/utils/audioData.js")
          s = p.read_text(encoding="utf-8")
          old = """      function startPlayback() {
                  source.start();
                  const startTime = audioContext.currentTime;
                  onTimeUpdate(0);
                  frame = requestAnimationFrame(updateCurrentTime);
                  function updateCurrentTime() {
                    onTimeUpdate(audioContext.currentTime - startTime);
                    frame = requestAnimationFrame(updateCurrentTime);
                  }
                }
                if (userOS === 'ios') {
                  silentAudioElement.play().then(startPlayback);
                } else {
                  startPlayback();
                }"""
          new = """      async function startPlayback() {
                  if (audioContext.state === 'suspended') {
                    try {
                      await audioContext.resume();
                    } catch (err) {
                      console.warn('AudioContext resume failed', err);
                    }
                  }
                  source.start();
                  const startTime = audioContext.currentTime;
                  onTimeUpdate(0);
                  frame = requestAnimationFrame(updateCurrentTime);
                  function updateCurrentTime() {
                    onTimeUpdate(audioContext.currentTime - startTime);
                    frame = requestAnimationFrame(updateCurrentTime);
                  }
                }
                if (userOS === 'ios') {
                  silentAudioElement
                    .play()
                    .catch((err) => console.warn('iOS silent-audio unlock failed', err))
                    .then(startPlayback);
                } else {
                  startPlayback();
                }"""
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          # ---------- Select All button ----------
          p = Path("app/src/SampleMenu.js")
          s = p.read_text(encoding="utf-8")

          marker = """        <Button
                    hidden={!hasMultiSelection}
                    className={classes.sampleMenuButtonFullWidth}
                    type="button"
                    variant="secondary"
                    onClick={() =>
                      setMultipleSelection((s) => (s && s.size ? new Set() : null))
                    }
                  >
                    {multipleSelection && multipleSelection.size
                      ? `Clear selection (${multipleSelection.size})`
                      : 'Done'}
                  </Button>"""

          select_all = """
                  <Button
                    hidden={!hasMultiSelection}
                    className={classes.sampleMenuButtonFullWidth}
                    type="button"
                    variant="secondary"
                    disabled={!userSamplesFiltered.length}
                    onClick={() =>
                      setMultipleSelection(
                        new Set(userSamplesFiltered.map((sample) => sample.id))
                      )
                    }
                  >
                    Select all ({userSamplesFiltered.length})
                  </Button>
          """

          if marker not in s:
              raise SystemExit("Could not find multi-selection control in SampleMenu.js")

          # Insert as a separate full-width control ABOVE Clear selection.
          s = s.replace(marker, select_all + marker, 1)

          p.write_text(s, encoding="utf-8")

          print("Applied multi-import, auto-slots, iOS audio fix, and Select All button.")

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "16"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "2.0.34"
          actions-cache-folder: emsdk-cache

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build KORG SYRO browser bindings
        working-directory: app
        run: |
          chmod +x build-bindings.sh build-factory-samples-index
          ./build-bindings.sh
          ./build-factory-samples-index

      - name: Build web app
        working-directory: app
        env:
          CI: "false"
        run: npm run build

      - name: Add third-party notices
        working-directory: app
        run: |
          cat > build/THIRD_PARTY_NOTICES.txt <<'EOF'
          Unofficial modified build of volca-sampler by Ben Wiley (MIT License).
          Uses KORG volca sample / SYRO SDK (BSD 3-Clause License).
          This site is independent and is not affiliated with or endorsed by KORG Inc.
          Modifications: multi-file import, sequential slots, iOS audio playback fix,
          and Select All for multi-selection.
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
